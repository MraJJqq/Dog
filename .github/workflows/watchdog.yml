name: Dog watchdog
on:
  push:
    branches: [main]
    paths:
      - dog.py
      - tests/test_dog.py
      - .github/workflows/watchdog.yml
  schedule:
    - cron: "3,9,15,21,27,33,39,45,51,57 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dog-watchdog
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Dog monitoring logic
        run: python -m unittest discover -s tests -v
      - name: Monitor and recover all Bark scans
        env:
          DOG_GITHUB_TOKEN: ${{ secrets.DOG_GITHUB_TOKEN }}
        run: python dog.py
