name: Dog watchdog
on:
  schedule:
    - cron: "3-59/6 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dog-watchdog
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Monitor and recover all Bark scans
        env:
          DOG_GITHUB_TOKEN: ${{ secrets.DOG_GITHUB_TOKEN }}
        run: python dog.py
