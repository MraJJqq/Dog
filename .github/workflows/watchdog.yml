name: watchdog
# Dog：每10分钟检查 Bark 自动扫描，并记录手动扫描结果
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dog-watchdog
  cancel-in-progress: false
env:
  SCAN_REPO: "MraJJqq/Vegasbark"
  WORKFLOW: "vegas.yml"
  REF: "main"
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 检查、补触发与通知
        env:
          WATCH_PAT: ${{ secrets.WATCH_PAT }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          SLOTS_UTC = [0, 2, 8, 12, 14]
          SLOT_MIN = 5
          GRACE = timedelta(minutes=15)
          STATE_FILE = Path("dog-state.json")

          repo = os.environ["SCAN_REPO"]
          wf = os.environ["WORKFLOW"]
          ref = os.environ["REF"]
          token = os.environ.get("WATCH_PAT", "")
          bark_key = os.environ.get("BARK_KEY", "")
          bark_server = os.environ.get("BARK_SERVER", "https://api.day.app").rstrip("/")
          workflow_api = f"https://api.github.com/repos/{repo}/actions/workflows/{wf}"

          def gh(method, url, body=None):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              req = urllib.request.Request(
                  url, method=method, data=json.dumps(body).encode() if body is not None else None,
                  headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  return error.code, {}
              except Exception as error:
                  print("GitHub API error:", error)
                  return 0, {}

          def bark(message):
              print("BARK:", message)
              if not bark_key:
                  print("缺少 BARK_KEY")
                  return False
              payload = {
                  "device_key": bark_key,
                  "title": "🐶 看门狗",
                  "body": message,
                  "group": "Watchdog",
                  "level": "timeSensitive",
              }
              req = urllib.request.Request(
                  f"{bark_server}/push", method="POST",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      result = json.loads(response.read() or b"{}")
                      return response.status == 200 and result.get("code") == 200
              except Exception as error:
                  print("Bark notification failed:", error)
                  return False

          def parse_time(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          if not token:
              bark("Dog 缺少 WATCH_PAT，无法读取或补触发 Bark 工作流")
              sys.exit(1)

          state = json.loads(STATE_FILE.read_text()) if STATE_FILE.exists() else {}
          completed = set(state.get("completed_slots", []))
          last_dispatch = state.get("last_dispatch", {})
          now = datetime.now(timezone.utc)

          code, data = gh("GET", f"{workflow_api}/runs?per_page=100")
          if code != 200:
              bark(f"读取 Bark 工作流失败（HTTP {code}），检查 WATCH_PAT 权限、仓库和工作流路径")
              sys.exit(1)

          runs = data.get("workflow_runs", [])
          slots = []
          for day_offset in (0, 1):
              day = (now - timedelta(days=day_offset)).date()
              for hour in SLOTS_UTC:
                  slot = datetime(day.year, day.month, day.day, hour, SLOT_MIN, tzinfo=timezone.utc)
                  if slot + GRACE <= now and slot >= now - timedelta(hours=36):
                      slots.append(slot)

          for slot in sorted(slots):
              slot_key = slot.strftime("%Y-%m-%dT%H:%M:%SZ")
              if slot_key in completed:
                  continue

              slot_end = slot + timedelta(minutes=30)
              scheduled = [
                  run for run in runs
                  if run.get("event") == "schedule"
                  and slot - timedelta(minutes=2) <= parse_time(run["created_at"]) < slot_end
              ]
              recovery = [
                  run for run in runs
                  if run.get("event") == "workflow_dispatch"
                  and slot_key in (run.get("display_title") or run.get("name") or "")
                  and "watchdog-recovery" in (run.get("display_title") or run.get("name") or "")
              ]
              relevant = scheduled + recovery
              if any(r.get("status") == "completed" and r.get("conclusion") == "success" for r in relevant):
                  completed.add(slot_key)
                  last_dispatch.pop(slot_key, None)
                  print("扫描成功：", slot_key)
                  continue
              active_runs = [r for r in relevant if r.get("status") != "completed"]
              still_running = []
              for run in active_runs:
                  age = now - parse_time(run["created_at"])
                  if age <= timedelta(minutes=6):
                      still_running.append(run)
                      continue
                  run_id = int(run["id"])
                  cancel_code, _ = gh(
                      "POST",
                      f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel"
                  )
                  if cancel_code not in (202, 409):
                      bark(f"任务超时且取消失败：运行编号 {run_id}，HTTP {cancel_code}")
                      sys.exit(1)
                  print("已取消超时任务：", run_id)

              if still_running:
                  print("扫描仍在6分钟时限内运行：", slot_key)
                  continue

              attempt = len(recovery) + 1
              code, _ = gh("POST", f"{workflow_api}/dispatches", {
                  "ref": ref,
                  "inputs": {"watchdog_slot": slot_key},
              })
              if code == 204:
                  last_dispatch[slot_key] = now.isoformat()
                  bark(f"{slot_key}（北京时间 {(slot + timedelta(hours=8)).strftime('%H:%M')}）扫描未成功，Dog 已补触发，第 {attempt} 次")
              else:
                  bark(f"{slot_key} 扫描补触发失败（HTTP {code}），检查 WATCH_PAT 的 Actions 写权限和分支")
                  sys.exit(1)

          state["completed_slots"] = sorted(completed)[-30:]
          state["last_dispatch"] = last_dispatch
          state["checked_at"] = now.isoformat()
          STATE_FILE.write_text(json.dumps(state, ensure_ascii=False, indent=2))
          print("Dog 检查完成")
          PY
      - name: 保存看门狗状态
        if: always()
        run: |
          git config user.name "dog-bot"
          git config user.email "dog-bot@users.noreply.github.com"
          git add dog-state.json
          git diff --cached --quiet || (git commit -m "Dog: persist watchdog state [skip ci]" && git pull --rebase && git push)
