name: Dog watchdog
run-name: "Dog watchdog"
on:
  push:
    branches: [main]
    paths:
      - dog.py
      - tests/test_dog.py
      - .github/workflows/dog-monitor.yml
  schedule:
    # Run the watchdog every six minutes.
    - cron: "*/6 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dog-watchdog
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Dog monitoring logic
        run: python -m unittest discover -s tests -v

  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Monitor and recover all Bark scans
        env:
          DOG_GITHUB_TOKEN: ${{ secrets.DOG_GITHUB_TOKEN }}
        run: python dog.py
